# AI-Powered Alligator Trading System Configuration

# Trading Settings
[trading]
symbol = EURUSD
timeframe = M1
lot_size = 0.1
sl_points = 100
tp_points = 100
max_risk_percent = 1.5
max_concurrent_positions = 1

# AI Settings
[ai]
model = llama3
host = localhost
port = 11434
temperature = 0.7
top_p = 0.9
max_tokens = 200

# Risk Management
[risk_management]
enable_dynamic_position_sizing = true
enable_volatility_adjustment = true
enable_drawdown_protection = true
max_daily_loss_percent = 5.0
max_weekly_loss_percent = 10.0
max_monthly_loss_percent = 15.0

# Technical Analysis
[technical_analysis]
alligator_jaw_period = 13
alligator_jaw_shift = 8
alligator_teeth_period = 8
alligator_teeth_shift = 5
alligator_lips_period = 5
alligator_lips_shift = 3
rsi_period = 14
macd_fast_period = 12
macd_slow_period = 26
macd_signal_period = 9
bollinger_bands_period = 20
bollinger_bands_std_dev = 2

# Logging
[logging]
level = INFO
log_file = logs/trading_system.log
max_log_size_mb = 10
backup_count = 5

# Database (if using)
[database]
enabled = false
host = localhost
port = 5432
database = trading_db
username = trader
password = secret

# Email Notifications
[email]
enabled = false
smtp_server = smtp.gmail.com
smtp_port = 587
sender_email = your_email@gmail.com
sender_password = your_app_password
recipient_email = recipient@gmail.com

# Webhook Notifications
[webhook]
enabled = false
url = https://hooks.slack.com/services/YOUR/WEBHOOK/URL